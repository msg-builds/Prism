name: Install focused frontend dependencies
description: Install the frontend and its workspace dependencies without the rest of Twenty.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24'
    - name: Install frontend workspaces
      shell: bash
      env:
        YARN_ENABLE_HARDENED_MODE: 'true'
        YARN_ENABLE_SCRIPTS: 'false'
        YARN_NM_MODE: hardlinks-local
      run: |
        df -h .
        node .yarn/releases/yarn-4.18.1.cjs workspaces focus twenty-monorepo twenty-front
        git diff --exit-code -- package.json yarn.lock .yarnrc.yml
        du -sh node_modules
        df -h .
