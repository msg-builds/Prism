# Standalone: Prism's own Postgres and Redis, files on a local volume.
x-bundled-env: &bundled-env
  PG_DATABASE_URL: postgres://prism:${PG_PASSWORD}@db:5432/prism
  REDIS_URL: redis://redis:6379
  STORAGE_TYPE: local

services:
  server:
    environment: *bundled-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    environment: *bundled-env

  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: prism
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U prism -d prism
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af
    command: ["--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
