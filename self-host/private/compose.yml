# Private Prism deployment: server, worker, Postgres, Redis and a Mailpit test
# inbox. Nothing listens publicly; the API, /mcp and Mailpit bind to loopback.
# Run: docker compose -p prism --env-file .env -f compose.yml up -d
# (.env from env.example; PRISM_IMAGE is a tag built by ../build-image.sh)
name: prism

x-prism-env: &prism-env
  PG_DATABASE_URL: postgres://prism:${PG_PASSWORD}@${PG_HOST:-db}:${PG_PORT:-5432}/${PG_DATABASE:-prism}
  SERVER_URL: ${SERVER_URL}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  APP_SECRET: ${APP_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  STORAGE_TYPE: ${STORAGE_TYPE:-local}
  STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
  STORAGE_S3_NAME: ${STORAGE_S3_NAME:-}
  STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
  STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
  STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
  EMAIL_DRIVER: smtp
  EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-mailpit}
  EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-1025}
  EMAIL_SMTP_NO_TLS: ${EMAIL_SMTP_NO_TLS:-true}
  EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
  EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Nebula}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
  TELEMETRY_ENABLED: "false"
  ALLOW_REQUESTS_TO_TWENTY_ICONS: "false"
  IS_BILLING_ENABLED: "false"

services:
  server:
    image: ${PRISM_IMAGE}
    environment:
      <<: *prism-env
      NODE_PORT: 3000
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    ports:
      - "127.0.0.1:${PRISM_PORT:-3130}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  worker:
    image: ${PRISM_IMAGE}
    command: ["yarn", "worker:prod"]
    environment:
      <<: *prism-env
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # Temporary private database until the shared platform cluster takes over
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: prism
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U prism -d prism
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af
    command: ["--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Controlled test inbox: captures all mail, delivers nothing
  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-3131}:8025"
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
  server-local-data:
